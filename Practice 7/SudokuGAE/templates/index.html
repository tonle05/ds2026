<!DOCTYPE html>
<html>
<head>
    <title>GAE Sudoku</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; }
        table { margin: 20px auto; border-collapse: collapse; border: 3px solid #333; }
        td { width: 40px; height: 40px; border: 1px solid #999; padding: 0; }
        input { width: 100%; height: 100%; text-align: center; font-size: 20px; border: none; outline: none; }
        /* Tô đậm đường biên khối 3x3 */
        td:nth-child(3n) { border-right: 3px solid #333; }
        tr:nth-child(3n) td { border-bottom: 3px solid #333; }
        td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        .btn { padding: 10px 20px; background: #4285f4; color: white; border: none; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .msg { color: red; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Sudoku on Google App Engine</h1>
    <form method="POST">
        <table>
            {% for r in range(9) %}
            <tr>
                {% for c in range(9) %}
                <td>
                    <input type="text" name="cell-{{r}}-{{c}}" 
                           value="{{ board[r][c] if board[r][c] != 0 else '' }}" 
                           maxlength="1">
                </td>
                {% endfor %}
            </tr>
            {% endfor %}
        </table>
        <button type="submit" class="btn">Check Solution</button>
    </form>
    <div class="msg">{{ message }}</div>
</body>
</html>
